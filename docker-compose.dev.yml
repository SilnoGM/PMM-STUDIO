# 开发环境只起数据库；应用本身用 pnpm dev 跑，便于热更新
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: pmm
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
